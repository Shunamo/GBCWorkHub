name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.2.0). Used only for workflow_dispatch."
        required: true
        default: "1.0.0"

# Repository variables (optional, for separate release repo):
#   RELEASE_OWNER  — GitHub org/user hosting the Release (default: this repo owner)
#   RELEASE_REPO   — repository name for Releases (default: this repo name)
#   RELEASE_BASE_URL — full override e.g. https://github.com/org/GBCWorkHub-Releases

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + release target
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v${{ github.event.inputs.version }}"
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $v = $tag.Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must be vMAJOR.MINOR.PATCH, got $tag" }

          $owner = "${{ vars.RELEASE_OWNER }}"
          $repo = "${{ vars.RELEASE_REPO }}"
          $base = "${{ vars.RELEASE_BASE_URL }}"
          if ([string]::IsNullOrWhiteSpace($owner)) { $owner = "${{ github.repository_owner }}" }
          if ([string]::IsNullOrWhiteSpace($repo)) { $repo = "${{ github.event.repository.name }}" }
          if ([string]::IsNullOrWhiteSpace($base)) { $base = "https://github.com/$owner/$repo" }
          $base = $base.TrimEnd('/')

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_owner=$owner" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_repo=$repo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release $tag → assets on $base"

      - name: Extract release notes from annotated tag
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          # actions/checkout fetches tags correctly, but then does its own follow-up
          # fetch of GITHUB_SHA into that same ref name (its way of guaranteeing the
          # triggering commit is present) — that overwrites refs/tags/$tag to point
          # directly at the commit, discarding the annotated tag object. Re-fetch the
          # tag explicitly so we read its message, not the commit's.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          # 태그가 annotated면(git tag -a vX.Y.Z -m "...") 그 메시지 본문을 그대로 쓴다.
          # lightweight 태그면 빈 문자열 — 이 경우 앱 내 업데이트 안내 팝업은 뜨지 않는다
          # (PendingReleaseNoticeStore.Save가 빈 텍스트를 무시함).
          $lines = git tag -l --format='%(contents:body)' $tag
          $notesText = if ($lines) { ($lines -join "`n").TrimEnd() } else { "" }

          $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
          "notes<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notesText | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ([string]::IsNullOrWhiteSpace($notesText)) {
            Write-Host "No annotated tag message found for $tag — release notice popup will not show for this update."
          } else {
            Write-Host "Release notes extracted from tag $tag ($($notesText.Length) chars)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore GBCWorkHub.sln

      - name: Inject AssemblyVersion / FileVersion from tag
        shell: pwsh
        run: .\scripts\set-assembly-version.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Write App.config from secret (bundled into the exe so it works out of the box)
        shell: pwsh
        env:
          APP_CONFIG_XML: ${{ secrets.APP_CONFIG_XML }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_CONFIG_XML)) {
            throw "APP_CONFIG_XML secret is not set. Add it in repo Settings > Secrets and variables > Actions."
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("src\GBCWorkHub.UI\App.config", $env:APP_CONFIG_XML, $utf8NoBom)

      - name: Build UI + Updater (Release)
        run: |
          msbuild src\GBCWorkHub.UI\GBCWorkHub.UI.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal
          msbuild tools\GBCWorkHub.Updater\GBCWorkHub.Updater.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal
          msbuild tools\GBCWorkHub.LegacyRedirect\GBCWorkHub.LegacyRedirect.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal

      - name: Verify EXE FileVersion matches tag
        shell: pwsh
        run: |
          $expected = "${{ steps.ver.outputs.version }}.0"
          $ui = "src\GBCWorkHub.UI\bin\Release\GBCWorkHub.UI.exe"
          $up = "tools\GBCWorkHub.Updater\bin\Release\GBCWorkHubUpdater.exe"
          $uiFv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $ui)).FileVersion
          $upFv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $up)).FileVersion
          Write-Host "UI FileVersion=$uiFv Updater FileVersion=$upFv expected=$expected"
          if ($uiFv -ne $expected) { throw "UI FileVersion mismatch" }
          if ($upFv -ne $expected) { throw "Updater FileVersion mismatch" }

      - name: Pack release zip + version.json (packageUrl = Release asset URL)
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          .\scripts\pack-release.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -Configuration Release `
            -OutputDir artifacts\release `
            -ReleaseBaseUrl "${{ steps.ver.outputs.release_base }}" `
            -LegacyStubExe "tools\GBCWorkHub.LegacyRedirect\bin\Release\GBCWorkHub.exe" `
            -ReleaseNotes $env:RELEASE_NOTES

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBCWorkHub-${{ steps.ver.outputs.tag }}
          path: artifacts/release/*

      - name: Create GitHub Release and upload version.json + zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GBCWorkHub ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            artifacts/release/GBCWorkHub-${{ steps.ver.outputs.tag }}.zip
            artifacts/release/GBCWorkHub-Setup-${{ steps.ver.outputs.tag }}.zip
            artifacts/release/GBCWorkHub-SiteSetup-${{ steps.ver.outputs.tag }}.zip
            artifacts/release/version.json
          generate_release_notes: false
          fail_on_unmatched_files: true
          # When RELEASE_REPO differs from this repo, set repository: owner/repo
          repository: ${{ steps.ver.outputs.release_owner }}/${{ steps.ver.outputs.release_repo }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
